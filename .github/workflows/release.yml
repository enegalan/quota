name: Release

# A tag is the release. Pushing `v*` builds the application from that exact
# commit, checks it, and attaches it to the GitHub Release for the tag, so what
# a user downloads is what that commit produced.
on:
  push:
    tags: ["v*"]
  # A tag that cannot be released, or a rebuilt asset, without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.2.0"
        required: true

# Build jobs only read. Publishing is a separate job that never runs restored
# or downloaded build tooling under a write token.
permissions:
  contents: read

# One release at a time. A second tag pushed while the first is still building
# waits rather than cancelling it: a half-uploaded release is worse than a slow
# one, and the uploads are per-asset and resumable with --clobber anyway.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Quota.app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # One architecture failing does not cost the other its release.
      fail-fast: false
      matrix:
        include:
          # macOS 26 because its default Xcode is the one the tests are written
          # against. The Intel image has no such Xcode, and that job is the
          # bundle: it proves the x86_64 build compiles, signs and verifies, while
          # the suite runs on the Apple Silicon job and in CI on the same commit.
          - runner: macos-26
            arch: arm64
            require_tests: true
          - runner: macos-15-intel
            arch: x86_64
            require_tests: false

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Tags and history, not just the commit: the version guard below
          # compares the tag against the bundle.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          # Build steps run make and downloaded tools; do not leave a write
          # credential in the git remote for that process tree.
          persist-credentials: false

      - name: Select Xcode
        run: Scripts/ci/select-xcode.sh ${{ matrix.require_tests && '--require-tests' || '' }}

      - name: Cache SwiftFormat
        uses: actions/cache@v4
        with:
          path: .build/tools/swiftformat
          key: swiftformat-0.64.5-${{ runner.os }}-${{ runner.arch }}

      - name: Install toolchain
        run: make bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve the tag and check it against the bundle's own version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          # A tag and a bundle that disagree are two versions wearing one name,
          # and the tag is the only one a reader can check.
          if [[ "${TAG#v}" != "${version}" ]]; then
            echo "::error::tag ${TAG} does not match CFBundleShortVersionString ${version}"
            exit 1
          fi
          # One convention for the steps that follow: an environment variable
          # written here is read there, and a name that differs only in case is an
          # unbound variable under `set -u`, not a near miss.
          echo "TAG=${TAG}" >>"${GITHUB_ENV}"
          echo "VERSION=${version}" >>"${GITHUB_ENV}"

      - name: Lint
        run: make lint

      # The same guarantee CI makes, on the architectures whose toolchain can
      # build the suite: a test that reaches out fails here rather than passing
      # because the runner happened to have connectivity. Where the toolchain
      # cannot build the suite, the job says so instead of pretending to.
      - name: Test without network
        if: ${{ env.SWIFT_MAJOR > 6 || (env.SWIFT_MAJOR == 6 && env.SWIFT_MINOR >= 3) }}
        run: |
          set -euo pipefail
          # pfctl has moved between /sbin and /usr/sbin across macOS releases,
          # so it is looked up rather than named. If it is nowhere, the tests
          # still run: the ones that must not use the network stub it, and say so
          # when they are reached, rather than depending on a firewall.
          pfctl="$(command -v pfctl || true)"
          if [[ -n "${pfctl}" ]]; then
            sudo "${pfctl}" -e
            cleanup() { sudo "${pfctl}" -d; }
            trap cleanup EXIT
          else
            echo "::warning::pfctl is not on this image; the firewall cannot be disabled"
          fi
          make test

      - name: Assemble and verify the release bundle
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # No plugin step: Scripts/bundle.sh builds every provider package in
          # the release configuration itself, and a provider that does not build
          # fails the release rather than being left out of the bundle.
          #
          # The signing identity is optional. Without the secret the bundle is
          # signed ad-hoc, which runs locally and is the honest default for a
          # build nobody has notarised; with it, the same command signs with a
          # Developer ID Application certificate.
          if [[ -n "${SIGNING_IDENTITY}" ]]; then
            make bundle BUILD_CONFIGURATION=release SIGNING_IDENTITY="${SIGNING_IDENTITY}"
          else
            make bundle BUILD_CONFIGURATION=release
          fi

      - name: Package the application
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # ditto rather than zip: it is what keeps a bundle's symlinks and
          # permissions, and a bundle that lost them does not launch.
          asset="Quota-${VERSION}-${ARCH}.zip"
          ditto -c -k --keepParent .build/Quota.app "${asset}"
          # The checksum is published next to the download rather than in a
          # commit, so it describes the file a user actually has.
          shasum -a 256 "${asset}" >"${asset}.sha256"
          echo "ASSET=${asset}" >>"${GITHUB_ENV}"
          ls -lh "${asset}" "${asset}.sha256"

      - name: Upload the packaged bundle
        uses: actions/upload-artifact@v4
        with:
          name: quota-${{ matrix.arch }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  publish:
    name: Attach bundles to the release
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout and no bootstrap: this job only moves already-built assets
      # onto the release, so a write token never sits beside make or downloads.
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: quota-*
          path: dist
          merge-multiple: true

      - name: Attach the bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::no release assets downloaded" >&2
            exit 1
          fi
          # No --verify-tag: this job has no checkout (write token must not sit
          # beside a working tree). The tag already started the workflow, and
          # the bundle job checked it against CFBundleShortVersionString.
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --title "Quota ${TAG}" --generate-notes
          fi
          gh release upload "${TAG}" "${files[@]}" --clobber
