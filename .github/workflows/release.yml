name: Release

# A tag is the release. Pushing `v*` builds the application from that exact
# commit, checks it, and attaches it to the GitHub Release for the tag, so what
# a user downloads is what that commit produced.
on:
  push:
    tags: ["v*"]
  # A tag that cannot be released, or a rebuilt asset, without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.2.0"
        required: true

permissions:
  contents: write

# One release at a time. A second tag pushed while the first is still building
# waits rather than cancelling it: a half-uploaded release is worse than a slow
# one, and the uploads are per-asset and resumable with --clobber anyway.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Quota.app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # One architecture failing does not cost the other its release.
      fail-fast: false
      matrix:
        include:
          # macOS 26 because its default Xcode is the one the tests are written
          # against. The Intel image has no such Xcode yet, and that job is the
          # bundle: it proves the x86_64 build compiles, signs and verifies, while
          # the suite runs here and in CI on the same commit.
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Tags and history, not just the commit: the release notes are
          # generated from what this tag added, and the version guard below
          # compares the tag against the bundle.
          fetch-depth: 0

      - name: Select Xcode
        # Named, not defaulted to. The tests are written against Swift 6.3, which
        # accepts a throwing call inside `#expect`; Swift 6.2, the newest the
        # Intel image ships, does not, and would fail the run with a hundred
        # macro errors that say nothing about the code they point at. Xcode 27
        # carries 6.3 and is on the Apple Silicon image. An image without it
        # still builds the application and its plugins, so the step says what it
        # is doing rather than failing.
        run: |
          set -euo pipefail
          for candidate in 27 26.3 26.4 26.5 26.6; do
            if [[ -d "/Applications/Xcode_${candidate}.app" ]]; then
              sudo xcode-select --switch "/Applications/Xcode_${candidate}.app"
              break
            fi
          done
          version="$(swift --version | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p')"
          read -r major minor <<<"${version}"
          echo "Swift ${major}.${minor} from $(xcode-select -p)"
          echo "SWIFT_MAJOR=${major}" >>"${GITHUB_ENV}"
          echo "SWIFT_MINOR=${minor}" >>"${GITHUB_ENV}"
          if [[ "${major}" -lt 6 ]] || { [[ "${major}" -eq 6 ]] && [[ "${minor}" -lt 3 ]]; }; then
            if [[ "${REQUIRE_TESTS:-}" == "true" ]]; then
              echo "::error::Swift 6.3 or later is required to build the test suite"
              exit 1
            fi
            echo "::warning::Swift ${major}.${minor} cannot build the test suite; this job verifies the bundle only"
          fi

      # Same guarantee CI makes, on the architectures where the toolchain can
      # build the suite. The Intel image has no Swift 6.3 yet, so that job proves
      # the bundle compiles, signs and verifies rather than repeating CI.
      - name: Test without network
        if: ${{ env.SWIFT_MAJOR > 6 || (env.SWIFT_MAJOR == 6 && env.SWIFT_MINOR >= 3) }}
        run: |
          set -euo pipefail
          # pfctl has moved between /sbin and /usr/sbin across macOS releases,
          # so it is looked up rather than named. If it is nowhere, the tests
          # still run: the ones that must not use the network stub it, and say so
          # when they are reached, rather than depending on a firewall.
          pfctl="$(command -v pfctl || true)"
          if [[ -n "${pfctl}" ]]; then
            sudo "${pfctl}" -e
            cleanup() { sudo "${pfctl}" -d; }
            trap cleanup EXIT
          else
            echo "::warning::pfctl is not on this image; the firewall cannot be disabled"
          fi
          make test

      - name: Assemble and verify the release bundle
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # No plugin step: Scripts/bundle.sh builds every provider package in
          # the release configuration itself, and a provider that does not build
          # fails the release rather than being left out of the bundle.
          #
          # The signing identity is optional. Without the secret the bundle is
          # signed ad-hoc, which runs locally and is the honest default for a
          # build nobody has notarised; with it, the same command signs with a
          # Developer ID Application certificate.
          if [[ -n "${SIGNING_IDENTITY}" ]]; then
            make bundle BUILD_CONFIGURATION=release SIGNING_IDENTITY="${SIGNING_IDENTITY}"
          else
            make bundle BUILD_CONFIGURATION=release
          fi

      - name: Package the application
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # ditto rather than zip: it is what keeps a bundle's symlinks and
          # permissions, and a bundle that lost them does not launch.
          asset="Quota-${VERSION}-${ARCH}.zip"
          ditto -c -k --keepParent .build/Quota.app "${asset}"
          # The checksum is published next to the download rather than in a
          # commit, so it describes the file a user actually has.
          shasum -a 256 "${asset}" >"${asset}.sha256"
          echo "asset=${asset}" >>"${GITHUB_ENV}"
          ls -lh "${asset}" "${asset}.sha256"

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Both architectures publish to one release, so the first to arrive
          # creates it and the other joins. Losing that race is not a failure;
          # a release still missing after the retries is.
          for attempt in 1 2 3 4 5; do
            if gh release view "${TAG}" >/dev/null 2>&1; then break; fi
            gh release create "${TAG}" --verify-tag --title "Quota ${TAG}" --generate-notes && break
            sleep 5
          done
          gh release view "${TAG}" >/dev/null
          gh release upload "${TAG}" "${ASSET}" "${ASSET}.sha256" --clobber
