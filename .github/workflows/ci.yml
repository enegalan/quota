name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, test, plugins, bundle
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        # Named rather than taken from whatever the image defaults to. The tests
        # are written against the compiler they are developed with: Swift 6.3
        # accepts a throwing call inside `#expect`, 6.2 does not, and an older
        # Xcode would fail the run with a hundred macro errors that say nothing
        # about the code they point at. Guarded, so an image without it says so
        # instead.
        run: |
          set -euo pipefail
          for candidate in 26.3 26.4 26.5 26.6 27; do
            if [[ -d "/Applications/Xcode_${candidate}.app" ]]; then
              sudo xcode-select --switch "/Applications/Xcode_${candidate}.app"
              break
            fi
          done
          version="$(swift --version | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1.\2/p')"
          echo "Swift ${version} from $(xcode-select -p)"
          if [[ "${version%%.*}" -lt 6 ]] || { [[ "${version%%.*}" -eq 6 ]] && [[ "${version##*.}" -lt 3 ]]; }; then
            echo "::error::Swift 6.3 or later is required to build the tests"
            exit 1
          fi

      - name: Install toolchain
        run: make bootstrap

      # Network is disabled in this step so a test that reaches out fails loudly
      # rather than passing on a developer machine with connectivity.
      - name: Test without network
        run: |
          set -euo pipefail
          # pfctl has moved between /sbin and /usr/sbin across macOS releases,
          # so it is looked up rather than named. If it is nowhere, the tests
          # still run: the ones that must not use the network stub it, and say so
          # when they are reached, rather than depending on a firewall.
          pfctl="$(command -v pfctl || true)"
          if [[ -n "${pfctl}" ]]; then
            sudo "${pfctl}" -e
            cleanup() { sudo "${pfctl}" -d; }
            trap cleanup EXIT
          else
            echo "::warning::pfctl is not on this image; the firewall cannot be disabled"
          fi
          make test

      - name: Lint
        run: make lint

      - name: Build provider plugins
        run: make plugins

      - name: Assemble and verify the application bundle
        run: make bundle

      - name: Check the working tree is clean
        if: always()
        run: git diff --exit-code
