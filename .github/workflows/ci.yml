name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, test, plugins, bundle
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        # Named, not defaulted to, and required rather than hoped for. The tests
        # are written against Swift 6.3, which accepts a throwing call inside
        # `#expect`; Swift 6.2, the newest the images ship today, does not, and
        # would fail the run with a hundred macro errors that say nothing about
        # the code they point at. Xcode 27 carries 6.3.
        run: |
          set -euo pipefail
          for candidate in 27 26.3 26.4 26.5 26.6; do
            if [[ -d "/Applications/Xcode_${candidate}.app" ]]; then
              sudo xcode-select --switch "/Applications/Xcode_${candidate}.app"
              break
            fi
          done
          version="$(swift --version | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p')"
          read -r major minor <<<"${version}"
          echo "Swift ${major}.${minor} from $(xcode-select -p)"
          echo "SWIFT_MAJOR=${major}" >>"${GITHUB_ENV}"
          echo "SWIFT_MINOR=${minor}" >>"${GITHUB_ENV}"
          if [[ "${major}" -lt 6 ]] || { [[ "${major}" -eq 6 ]] && [[ "${minor}" -lt 3 ]]; }; then
            echo "::error::Swift 6.3 or later is required to build the test suite"
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Build provider plugins
        run: make plugins

      - name: Assemble and verify the application bundle
        run: make bundle

      - name: Check the working tree is clean
        if: always()
        run: git diff --exit-code
