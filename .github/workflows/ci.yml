name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, test, plugins, bundle
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        # The newest Xcode on the image, because the tests are written against
        # the compiler they are developed with: Swift 6.3 accepts a throwing call
        # inside `#expect`, and 6.0 does not, so pinning CI to an older Xcode
        # would have CI unable to build the tests it exists to run.
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select --switch "${newest}"
          swift --version

      - name: Install toolchain
        run: make bootstrap

      # Network is disabled in this step so a test that reaches out fails loudly
      # rather than passing on a developer machine with connectivity.
      - name: Test without network
        run: |
          set -euo pipefail
          # pfctl has moved between /sbin and /usr/sbin across macOS releases,
          # so it is looked up rather than named. If it is nowhere, the tests
          # still run: the ones that must not use the network stub it, and say so
          # when they are reached, rather than depending on a firewall.
          pfctl="$(command -v pfctl || true)"
          if [[ -n "${pfctl}" ]]; then
            sudo "${pfctl}" -e
            cleanup() { sudo "${pfctl}" -d; }
            trap cleanup EXIT
          else
            echo "::warning::pfctl is not on this image; the firewall cannot be disabled"
          fi
          make test

      - name: Lint
        run: make lint

      - name: Build provider plugins
        run: make plugins

      - name: Assemble and verify the application bundle
        run: make bundle

      - name: Check the working tree is clean
        if: always()
        run: git diff --exit-code
